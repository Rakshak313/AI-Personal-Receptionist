; ============================================================================
;  pjsip_minimal.conf — Minimal working Asterisk 18 PJSIP config for ext 1001
;  Tuned for: Ubuntu WSL2 (mirrored networking) + Linphone (UDP)
;
;  Install:  sudo cp pjsip_minimal.conf /etc/asterisk/pjsip.conf
;  Reload:   sudo asterisk -rx 'pjsip reload'
; ============================================================================

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
local_net=192.168.121.0/24,127.0.0.0/8

[1001]
type=endpoint
context=from-internal
transport=transport-udp
disallow=all
allow=ulaw
allow=alaw
direct_media=no
rewrite_contact=yes
rtp_symmetric=yes
force_rport=yes
auth=1001
aors=1001

[1001]
type=auth
auth_type=userpass
username=1001
password=AIReceptionist@2026

[1001]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30
